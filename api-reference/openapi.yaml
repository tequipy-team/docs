  /integration/collections/{id}:
    get:
      tags:
      - equipment-collection-api-controller
      operationId: getById_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EquipmentCollectionResponse"
components:
  schemas:
    CreateEmployeeRequest:
      type: object
      properties:
        fullName:
          type: string
        position:
          type: string
        email:
          type: string
        phone:
          type: string
        startDate:
          type: string
          format: date
        equipmentIds:
          uniqueItems: true
          type: array
          items:
            type: string
            format: uuid
        role:
          type: string
          enum:
          - EMPLOYEE
          - COMPANY_ADMIN
          - TEQUIPY_ADMIN
          - STORAGE
          - INTERNAL_ADMIN
          - API_CLIENT
          - API_CLIENT_READONLY
          - AI_AGENT
        tags:
          uniqueItems: true
          type: array
          items:
            type: string
            format: uuid
        licences:
          uniqueItems: true
          type: array
          items:
            $ref: "#/components/schemas/CreateUserLicenceRequest"
        privateEmail:
          type: string
        address:
          $ref: "#/components/schemas/DeliveryAddressRequest"
        sendToWorkEmail:
          type: boolean
    CreateUserLicenceRequest:
      type: object
      properties:
        name:
          type: string
        from:
