          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserEquipmentResponse"
    patch:
      tags:
      - user-equipment-api-controller
      operationId: editEquipment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
