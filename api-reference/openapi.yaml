                $ref: "#/components/schemas/EquipmentCollectionResponse"
  /integration/collections/{id}/cancel:
    post:
      tags:
      - equipment-collection-api-controller
      operationId: cancel_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
