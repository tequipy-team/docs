      required:
      - id
      - name
      type: object
    UserResponse:
      required:
      - email
      - id
      type: object
    ArchiveUserRequest:
      type: object
      properties:
        equipmentArchivizationType:
          type: string
          enum:
          - ARCHIVED
          - GIVEN_AWAY
    UsersQueryApiRequest:
      type: object
      properties:
        searchPhrase:
          type: string
        states:
          uniqueItems: true
          type: array
          items:
            type: string
            enum:
            - CREATED
            - ACTIVE
            - ARCHIVED
            - DELETED
            - OFFBOARDING_IN_PROGRESS
            - OFFBOARDED
        roles:
          uniqueItems: true
          type: array
          items:
            type: string
            enum:
            - EMPLOYEE
            - COMPANY_ADMIN
            - TEQUIPY_ADMIN
            - STORAGE
            - INTERNAL_ADMIN
            - API_CLIENT
            - API_CLIENT_READONLY
            - AI_AGENT
        companyId:
          type: string
          format: uuid
    Pageable:
      type: object
      properties:
        page:
          minimum: 0
          type: integer
          format: int32
        size:
          minimum: 1
          type: integer
          format: int32
        sort:
          type: array
          items:
            type: string
    CompanyAddressResponse:
      required:
      - country
      - id
      - type
      type: object
      properties:
        id:
          type: string
          format: uuid
        addressName:
          type: string
        streetLine1:
          type: string
        streetLine2:
