openapi: 3.0.1
info:
  title: Tequipy Integration API
  description: Public/partner API for Tequipy integrations. All endpoints require
    a Bearer JWT token obtained via the Tequipy authentication flow.
  version: v1
servers:
- url: https://prod.backend.tequipy.com
security:
- bearerAuth: []
paths:
  /integration/users:
    post:
      tags:
      - users-api-controller
      operationId: createEmployee
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeRequest"
        required: true
      responses:
        "200":
          description: OK
          content: {}
  /integration/users/{id}/archive:
    post:
      tags:
      - users-api-controller
      operationId: archiveUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveUserRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /integration/users/query:
    post:
      tags:
      - users-api-controller
      operationId: queryUsers
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsersQueryApiRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageUserResponse"
  /integration/user-equipments/query:
    post:
      tags:
      - user-equipment-api-controller
      operationId: queryUserEquipments
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      requestBody:
