        contactPersonPhone:
          type: string
        contactPersonEmail:
          type: string
        supportedCountries:
          type: array
          items:
            $ref: "#/components/schemas/CountryResponse"
    CountryResponse:
      required:
      - code
      - displayName
      type: object
      properties:
        code:
